name: Update Jobs Data

on:
  schedule:
    # Runs every 12 hours (at 06:00 and 18:00 UTC)
    - cron: '0 6,18 * * *'
  workflow_dispatch: # Also allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python scripts/scraper.py

      - name: Commit and push updated jobs.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          git diff --cached --quiet || git commit -m "chore: auto-update jobs data [$(date +'%Y-%m-%d %H:%M')]"
          git push
