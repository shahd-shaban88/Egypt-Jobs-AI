<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egypt Jobs AI | AI & ML Opportunities in Egypt</title>
    <meta name="description" content="Discover the latest Artificial Intelligence, Machine Learning, and Data Science jobs and internships in Egypt.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="navbar">
        <div class="container nav-content">
            <div class="logo">
                <i class="fa-solid fa-robot"></i>
                <span>Egypt Jobs AI</span>
            </div>
            <nav>
                <a href="https://github.com/ftyyr/Egypt-Jobs-AI" target="_blank" class="github-link"><i class="fa-brands fa-github"></i> Open Source</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h1>Find Your Next <span class="highlight">AI Career</span> in Egypt</h1>
            <p>Curated Artificial Intelligence, Machine Learning, and Data Science opportunities updated daily.</p>
            
            <div class="search-container">
                <div class="search-bar">
                    <i class="fa-solid fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search by job title, company, or keywords...">
                </div>
            </div>
        </section>

        <section class="filters-section">
            <div class="filters">
                <button class="filter-btn active" data-filter="All">All Opportunities</button>
                <button class="filter-btn" data-filter="Full-time">Full-time</button>
                <button class="filter-btn" data-filter="Internship">Internship</button>
                <button class="filter-btn" data-filter="Remote">Remote</button>
            </div>
        </section>

        <section class="jobs-section">
            <div class="jobs-header">
                <h2 id="jobCount">Loading opportunities...</h2>
            </div>
            <div id="jobsList" class="jobs-grid">
                <!-- Jobs will be injected here via JS -->
            </div>
        </section>
    </main>

    <footer>
        <div class="container footer-content">
            <p>&copy; 2026 Egypt Jobs AI. Open source project updated automatically.</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
